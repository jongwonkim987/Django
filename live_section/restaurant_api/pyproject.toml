[project]
name = "restaurant-api"
version = "0.1.0"
description = "Restaurant Review API"
authors = [
    {name = "admin"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "django-cleanup (>=9.0.0,<10.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "DJ", "UP", "B", "Q"]
ignore = ["E203"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F403", "F405"]
