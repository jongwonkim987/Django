<!-- templates/registration/signup_done.html -->
{% extends 'registration/base.html' %}

{% block title %}회원가입 완료 - Todo App{% endblock %}

{% block content %}
<div class="text-center">
    <div class="mb-3" style="font-size: 3rem;">📧</div>
    <h2>이메일 인증이 필요합니다</h2>
    <p class="text-muted">
        가입하신 이메일 주소로 인증 메일을 발송했습니다.<br>
        메일함을 확인하고 인증 링크를 클릭해주세요.
    </p>
    <hr>
    <p class="small text-muted mb-0">
        인증 링크는 <strong>1시간</strong> 동안 유효합니다.<br>
        메일이 오지 않는 경우 스팸 메일함을 확인해주세요.
    </p>
    <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">로그인 페이지로</a>
</div>
{% endblock %}
