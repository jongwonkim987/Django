<!-- templates/registration/verify_success.html -->
{% extends 'registration/base.html' %}

{% block title %}이메일 인증 성공 - Todo App{% endblock %}

{% block extra_head %}
<meta http-equiv="refresh" content="5;url={% url 'login' %}">
{% endblock %}

{% block content %}
<div class="text-center">
    <div class="mb-3" style="font-size: 3rem;">✅</div>
    <h2>인증 성공!</h2>
    <p class="text-muted">
        이메일 인증이 완료되었습니다.<br>
        이제 로그인하여 서비스를 이용하실 수 있습니다.
    </p>
    <p class="small text-muted">
        <span id="countdown">5</span>초 후 로그인 페이지로 이동합니다.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary">지금 로그인하기</a>
</div>
{% endblock %}

{% block extra_script %}
<script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "{% url 'login' %}";
        }
    }, 1000);
</script>
{% endblock %}
