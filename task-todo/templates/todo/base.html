<!-- templates / todo / base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="{% url 'todo_list' %}">🏠 Home</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if request.user.is_authenticated %}
                <span class="text-white">{{ request.user.username }}</span>
                <form action="{% url 'logout' %}" method="POST" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'signup' %}" class="btn btn-outline-light btn-sm">SignUp</a>
                <a href="{% url 'login' %}" class="btn btn-light btn-sm">Login</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
