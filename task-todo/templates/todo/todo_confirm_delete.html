{% extends 'todo/base.html' %}

{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 600px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .button-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    .cancel-button {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
    }
    .cancel-button:hover {
        background-color: #545b62;
    }
    .delete-button {
        background-color: #ff1122;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
    }
    .delete-button:hover {
        background-color: #cc1122;
    }
</style>

<div class="container" style="margin-top: 15px">
    <h1>정말 삭제하시겠습니까?</h1>
    <p style="text-align: center; color: #666">"{{ object.title }}"</p>
    <form method="post">
        {% csrf_token %}
        <div class="button-group">
            <button type="button" class="cancel-button"
                    onclick="location.href='{% url 'cbv_todo_info' object.id %}'">취소</button>
            <button type="submit" class="delete-button">삭제</button>
        </div>
    </form>
</div>

{% endblock %}
